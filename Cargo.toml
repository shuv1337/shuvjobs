[workspace]
resolver = "2"
members = [
    "crates/sta-core",
    "crates/sta-adapters",
    "crates/sta-tui",
    "crates/sta-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ali/sta"
rust-version = "1.75"

[workspace.dependencies]
sta-core = { path = "crates/sta-core" }
sta-adapters = { path = "crates/sta-adapters" }
sta-tui = { path = "crates/sta-tui" }

chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.28"
crossterm = "0.28"
plist = "1"
clap = { version = "4", features = ["derive"] }
